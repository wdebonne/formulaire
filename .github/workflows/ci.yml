name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Une nouvelle poussée sur la même branche annule la précédente : inutile de payer deux fois le
# build d'un commit déjà remplacé.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Types, tests et build
    runs-on: ubuntu-latest

    env:
      # Le build touche la base (metadata du layout, génération statique) : une base jetable
      # suffit, aucune donnée n'en sort.
      DATABASE_URL: file:./ci.db
      # Valeur factice : `src/lib/auth.ts` refuse de démarrer sans, et aucun secret réel n'a à
      # exister pour compiler.
      JWT_SECRET: ci-secret-sans-valeur-reelle-0123456789
      NEXT_TELEMETRY_DISABLED: '1'
      # La minuterie de maintenance est armée depuis le layout racine, qui s'exécute pendant la
      # génération statique : sans cela le build lancerait rapports et purges sur la base jetable.
      SCHEDULER: '0'

    steps:
      - uses: actions/checkout@v4

      # La version vient de .nvmrc, pour qu'elle ne puisse pas diverger de l'image Docker et du
      # poste de développement — le sujet de « Parité des versions d'exécution » dans CONTRIBUTING.
      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # `npm ci` et non `npm install` : il exige un package-lock.json cohérent et installe
      # exactement ce qu'il décrit. Une dépendance ajoutée sans son lock échoue ici.
      - name: Installer les dépendances
        run: npm ci

      - name: Générer le client Prisma
        run: ./node_modules/.bin/prisma generate

      - name: Vérifier les types
        run: npm run typecheck

      - name: Tests unitaires
        run: npm test

      # Ce que le typecheck ne voit pas : un module serveur importé depuis un composant
      # 'use client', un paquet absent du bundle, une route qui ne compile pas.
      - name: Préparer la base du build
        run: ./node_modules/.bin/prisma db push --skip-generate

      - name: Build de production
        run: npm run build

  # La migration est rejouée en production par docker-entrypoint.sh : une migration qui ne passe
  # pas sur une base *peuplée* bloque tous les déploiements existants, et ne se voit pas sur une
  # base vide (le INSERT ... SELECT ne copie alors aucune ligne).
  migrations:
    name: Migrations sur une base peuplée
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: file:./migrate.db
      JWT_SECRET: ci-secret-sans-valeur-reelle-0123456789
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Rejouer les migrations
        run: ./node_modules/.bin/prisma migrate deploy

      - name: Peupler, puis rejouer à nouveau
        run: |
          ./node_modules/.bin/prisma generate
          npm run db:seed
          ./node_modules/.bin/prisma migrate deploy
